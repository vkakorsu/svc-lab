name: tasks
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
      max-parallel: 6
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: run
        env:
          TARGET: ${{ vars.TARGET }}
          SID: ${{ vars.SID }}
          DURATION_MIN: "25"
          CONC: "3"
          HOLD: "150"
        run: node lib/run_all.mjs
